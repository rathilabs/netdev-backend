name: Build and Release Backend Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04, ubuntu-24.04, macos-13, macos-14, macos-15]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Basic Syntax Check
        run: |
          python -m compileall .
      # Add tests here if available

  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-20.04
            arch: x64
            binary_name: backend-linux-x64
            container: python:3.9-slim-buster
          - os: ubuntu-24.04-arm
            arch: arm64
            binary_name: backend-linux-arm64
            container: python:3.9-slim-buster
          - os: macos-13
            arch: x64
            binary_name: backend-macos-x64
          - os: macos-14
            arch: arm64
            binary_name: backend-macos-arm64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install build tools in container
        if: matrix.container != ''
        run: |
          apt-get update && apt-get install -y binutils gcc
      
      - uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.container == ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Binary
        run: |
          pyinstaller --onefile main.py --name ${{ matrix.binary_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name == 'main' && format('latest-{0}', github.sha) || github.ref_name }}
          name: ${{ github.ref_name == 'main' && 'Latest Build' || format('Release {0}', github.ref_name) }}
          draft: false
          prerelease: ${{ github.ref_name == 'main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
